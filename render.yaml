databases:
  - name: reclaimed-artistry-db
    databaseName: reclaimed_artistry
    user: reclaimed_artistry
    plan: starter

services:
  - type: web
    name: reclaimed-artistry
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: reclaimed-artistry-renders
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reclaimed-artistry-db
          property: connectionString
      - key: STORAGE_DIR
        value: /app/storage
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
